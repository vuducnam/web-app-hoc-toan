<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đang tải… — Math SGK</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#fffdf7; --brand:#0cbbab; --brand-dark:#067a70; --sun:#f0b429; --coral:#ff3366; --ink:#0f172a; }
  body { background: var(--paper); font-family: Nunito, sans-serif; color: var(--ink); }
  .font-display { font-family: Fredoka, sans-serif; }

  /* bounce loop for mascot */
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .bob { animation: bob 1.2s ease-in-out infinite; }

  /* dots pulse */
  @keyframes dot-pulse { 0%, 80%, 100% { opacity: .3; transform: scale(.9); } 40% { opacity: 1; transform: scale(1); } }
  .dot { animation: dot-pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }

  /* shimmer skeleton */
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .bob, .dot, .skeleton { animation: none !important; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- TWO MODES: A) full-screen Mimi loader (student)  B) skeleton layout (parent & list views) -->

<!-- A) FULL-SCREEN STUDENT LOADER -->
<section class="min-h-screen grid place-items-center p-6">
  <div class="text-center">
    <!-- annotation: Mimi 'thinking' state SVG 140px, bob loop -->
    <div class="w-36 h-36 mx-auto rounded-full bg-[var(--sun)] grid place-items-center text-white font-display font-bold bob">
      MIMI<br/>(thinking)
    </div>

    <h1 class="font-display text-2xl font-bold mt-6">Đang tải…</h1>
    <p class="text-slate-600 mt-1">Mimi đang chuẩn bị bài cho bạn</p>

    <!-- three bouncing dots -->
    <div class="mt-5 flex items-center justify-center gap-2">
      <span class="dot w-3 h-3 rounded-full bg-[var(--brand)]"></span>
      <span class="dot w-3 h-3 rounded-full bg-[var(--sun)]"></span>
      <span class="dot w-3 h-3 rounded-full bg-[var(--coral)]"></span>
    </div>

    <!-- Loading progress bar (indeterminate) -->
    <div class="mt-6 w-64 h-2 bg-white rounded-full overflow-hidden mx-auto border border-slate-200">
      <div class="h-full bg-gradient-to-r from-[var(--brand)] via-[var(--sun)] to-[var(--coral)] w-1/3 rounded-full"
           style="animation: shimmer 1.4s linear infinite; background-size: 200% 100%;"></div>
    </div>

    <p class="text-xs text-slate-400 mt-8">Mẹo: Bạn có thể làm toán offline — dữ liệu sẽ đồng bộ khi có mạng.</p>
  </div>
</section>
